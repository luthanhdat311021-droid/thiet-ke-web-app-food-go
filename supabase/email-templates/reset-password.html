<!-- Supabase → Authentication → Email Templates → Reset password
     Subject: Đặt lại mật khẩu FoodGo -->
<div style="background:#fffaf7;padding:32px 16px;font-family:Arial,Helvetica,sans-serif;color:#241c19">
  <div style="max-width:480px;margin:0 auto;background:#ffffff;border-radius:16px;padding:32px">
    <p style="margin:0 0 24px;font-size:22px;font-weight:800">Food<span style="color:#ff5b35">Go</span></p>
    <h1 style="margin:0 0 12px;font-size:20px">Đặt lại mật khẩu</h1>
    <p style="margin:0 0 24px;font-size:15px;line-height:1.6;color:#746b67">
      Chúng tôi nhận được yêu cầu đặt lại mật khẩu cho tài khoản <b style="color:#241c19">{{ .Email }}</b>. Bấm nút bên dưới để tạo mật khẩu mới.
    </p>
    <a href="{{ .ConfirmationURL }}" style="display:inline-block;background:#ff5b35;color:#ffffff;text-decoration:none;font-weight:700;font-size:15px;padding:14px 28px;border-radius:12px">Đặt mật khẩu mới</a>
    <p style="margin:24px 0 0;font-size:13px;line-height:1.6;color:#9c918c">
      Liên kết có hiệu lực trong 1 giờ. Nếu bạn không yêu cầu đổi mật khẩu, hãy bỏ qua email này, mật khẩu của bạn vẫn giữ nguyên.
    </p>
  </div>
</div>
