<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>FoodGo – Mất kết nối</title>
  <style>
    html, body { margin: 0; height: 100%; background: #fffaf7; color: #241c19; font-family: system-ui, sans-serif; }
    main { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; box-sizing: border-box; text-align: center; }
    .logo { width: 72px; height: 72px; border-radius: 20px; background: #ff5b35; color: #fff; display: grid; place-items: center; font-size: 36px; font-weight: 800; }
    h1 { font-size: 22px; margin: 24px 0 8px; }
    p { color: #746b67; line-height: 1.6; margin: 0 0 28px; max-width: 320px; }
    button { height: 48px; padding: 0 28px; border: 0; border-radius: 12px; background: #ff5b35; color: #fff; font-size: 16px; font-weight: 700; }
  </style>
</head>
<body>
  <main>
    <div class="logo">F</div>
    <h1>Không có kết nối mạng</h1>
    <p>FoodGo cần Internet để tải món ăn và đơn hàng. Hãy kiểm tra Wi-Fi hoặc dữ liệu di động rồi thử lại.</p>
    <button onclick="location.href='https://thiet-ke-web-app-food-go.vercel.app'">Thử lại</button>
  </main>
</body>
</html>
